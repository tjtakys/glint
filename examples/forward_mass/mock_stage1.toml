# Fit settings used only by the final noiseless lensed-cube recovery check.
# Add or remove any supported mass, source, or lens parameter below.

[pressure_support]
# "constant_scale_height" or "self_gravitating_hydrostatic"
vertical_model = "self_gravitating_hydrostatic"

[recovery]
max_workers = 7
free_parameters = [
    "log10_m_baryon",
    "disk_scale_radius_kpc",
    "log10_m200",
    "bulge_to_total",
    "bulge_effective_radius_kpc",
    "source_x_arcsec",
    "source_y_arcsec",
    "flux_normalization",
    "inclination_deg",
    "position_angle_deg",
    "surface_brightness_scale_arcsec",
    "velocity_dispersion_center_kms",
    "velocity_dispersion_scale_arcsec",
    "systemic_velocity_kms",
    "einstein_radius_arcsec",
    "lens_axis_ratio",
    "lens_position_angle_deg",
    "log10_external_shear",
    "external_shear_position_angle_deg",
#    "external_convergence",
]

[bounds.log10_m_baryon]
lower = 10.0
upper = 12.0
initial = 10.85

[bounds.disk_scale_radius_kpc]
lower = 0.2
upper = 3.0
initial = 1.25

[bounds.log10_m200]
lower = 10.0
upper = 14.0
initial = 11.75

[bounds.bulge_to_total]
lower = 0.0
upper = 0.75
initial = 0.3

[bounds.bulge_effective_radius_kpc]
lower = 0.05
upper = 1.5
initial = 0.48

[bounds.source_x_arcsec]
lower = -0.4
upper = 0.7
initial = 0.20

[bounds.source_y_arcsec]
lower = -0.4
upper = 0.4
initial = 0.00

[bounds.flux_normalization]
lower = 0.01
upper = 3.0
initial = 0.80

[bounds.inclination_deg]
lower = 10.0
upper = 80.0
initial = 55.0

[bounds.position_angle_deg]
lower = 0
upper = 360
initial = 50.0

[bounds.surface_brightness_scale_arcsec]
lower = 0.03
upper = 0.6
initial = 0.30

[bounds.velocity_dispersion_center_kms]
lower = 5.0
upper = 250.0
initial = 40.0

[bounds.velocity_dispersion_scale_arcsec]
lower = 0.03
upper = 10.0
initial = 1.00

[bounds.systemic_velocity_kms]
lower = -100.0
upper = 100.0
initial = 10.0

[bounds.einstein_radius_arcsec]
lower = 0.7
upper = 1.7
initial = 1.10

[bounds.lens_axis_ratio]
lower = 0.5
upper = 0.999
initial = 0.90

[bounds.lens_position_angle_deg]
lower = 0.0
upper = 180.0
initial = 80.0

[bounds.log10_external_shear]
lower = -4.0
upper = -0.5
initial = -1.7

[bounds.external_shear_position_angle_deg]
lower = 0
upper = 180
initial = 40.0

[bounds.external_convergence]
lower = -0.2
upper = 0.2
initial = 0.02
